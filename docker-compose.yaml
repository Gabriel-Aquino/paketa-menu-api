version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: paketa_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  api:
    build:
      context: .
      target: builder
    container_name: paketa_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/paketa_menu
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    depends_on:
      - mongodb

volumes:
  mongo_data: